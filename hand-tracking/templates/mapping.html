<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unity Puppet Camera</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", sans-serif;
      background: #111312;
      color: #f4f6f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111312;
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    header, .toolbar, .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    header {
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0;
    }

    button {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid #4d5751;
      border-radius: 6px;
      background: #252a27;
      color: #f7faf8;
      font: inherit;
      cursor: pointer;
    }

    button.primary {
      border-color: #50c878;
      background: #1d6d3b;
    }

    button:disabled { opacity: .5; cursor: default; }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid #343a36;
      border-radius: 6px;
      background: #050605;
    }

    .stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #aeb8b1;
      pointer-events: none;
    }

    .panel {
      margin-top: 12px;
      padding: 12px 0;
      border-top: 1px solid #343a36;
    }

    .status-row { justify-content: space-between; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(90px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      border: 1px solid #343a36;
      border-radius: 6px;
      background: #181b19;
    }

    .metric span {
      display: block;
      color: #9fa9a2;
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .ok { color: #65dc8c; }
    .warn { color: #ffca5c; }

    video, canvas { display: none; }

    @media (max-width: 720px) {
      main { padding: 12px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stage { aspect-ratio: 4 / 3; }
    }
  </style>
</head>
<body data-mode="mapping">
  <main>
    <header>
      <div>
        <a href="/" style="color:#78dc9a;text-decoration:none">← 返回模式選擇</a>
        <h1 style="margin-top:8px">手部映射模式</h1>
      </div>
      <div class="toolbar">
        <button id="calibrateButton" type="button">重新校正</button>
        <button id="cameraButton" class="primary" type="button">啟動攝影機</button>
      </div>
    </header>

    <section class="stage" aria-label="手部辨識預覽">
      <img id="processedPreview" alt="手部辨識預覽">
      <div id="emptyState" class="empty">攝影機尚未啟動</div>
    </section>

    <section class="panel">
      <div class="status-row">
        <strong id="cameraStatus" class="warn">等待攝影機</strong>
        <span id="calibrationStatus">尚未校正</span>
      </div>
      <div class="metrics">
        <div class="metric"><span>頭部</span><strong id="headNod">0.00</strong></div>
        <div class="metric"><span>左手</span><strong id="leftArm">0.00</strong></div>
        <div class="metric"><span>右手</span><strong id="rightArm">0.00</strong></div>
        <div class="metric"><span>轉身</span><strong id="bodyTurn">0.00</strong></div>
        <div class="metric"><span>位移</span><strong id="moveX">0.00</strong></div>
      </div>
    </section>

    <video id="camera" autoplay muted playsinline></video>
    <canvas id="captureCanvas" width="640" height="480"></canvas>
  </main>

  <script>
    const video = document.querySelector("#camera");
    const canvas = document.querySelector("#captureCanvas");
    const context = canvas.getContext("2d", { alpha: false });
    const cameraButton = document.querySelector("#cameraButton");
    const calibrateButton = document.querySelector("#calibrateButton");
    const preview = document.querySelector("#processedPreview");
    const emptyState = document.querySelector("#emptyState");
    const cameraStatus = document.querySelector("#cameraStatus");
    const calibrationStatus = document.querySelector("#calibrationStatus");
    let stream = null;
    let sending = false;
    let lastCapture = 0;

    fetch("/control_mode", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "mapping" })
    });

    function setCameraStatus(message, ready) {
      cameraStatus.textContent = message;
      cameraStatus.className = ready ? "ok" : "warn";
    }

    async function startCamera() {
      cameraButton.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        preview.src = "/video_feed?session=" + Date.now();
        emptyState.hidden = true;
        cameraButton.textContent = "停止攝影機";
        setCameraStatus("攝影機已連線", true);
        requestAnimationFrame(captureLoop);
      } catch (error) {
        setCameraStatus("無法開啟攝影機", false);
        emptyState.textContent = error.message;
        emptyState.hidden = false;
      } finally {
        cameraButton.disabled = false;
      }
    }

    function stopCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      preview.removeAttribute("src");
      emptyState.textContent = "攝影機尚未啟動";
      emptyState.hidden = false;
      cameraButton.textContent = "啟動攝影機";
      setCameraStatus("等待攝影機", false);
    }

    async function sendFrame(blob) {
      try {
        await fetch("/frame", {
          method: "POST",
          headers: { "Content-Type": "image/jpeg" },
          body: blob,
          cache: "no-store"
        });
      } finally {
        sending = false;
      }
    }

    function captureLoop(timestamp) {
      if (!stream) return;
      if (!sending && timestamp - lastCapture >= 33 && video.readyState >= 2) {
        lastCapture = timestamp;
        sending = true;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if (blob) sendFrame(blob);
          else sending = false;
        }, "image/jpeg", 0.76);
      }
      requestAnimationFrame(captureLoop);
    }

    async function refreshState() {
      try {
        const response = await fetch("/puppet_state", { cache: "no-store" });
        const state = await response.json();
        for (const key of ["headNod", "leftArm", "rightArm", "bodyTurn", "moveX"]) {
          document.querySelector("#" + key).textContent = Number(state[key] || 0).toFixed(2);
        }
        calibrationStatus.textContent = state.calibrated
          ? "校正完成"
          : "校正 " + Math.round(Number(state.calibrationProgress || 0) * 100) + "%";
      } catch (_) {
        setCameraStatus("Docker 服務未連線", false);
      }
    }

    cameraButton.addEventListener("click", () => stream ? stopCamera() : startCamera());
    calibrateButton.addEventListener("click", async () => {
      await fetch("/calibrate", { method: "POST" });
      calibrationStatus.textContent = "校正 0%";
    });

    setInterval(refreshState, 100);
    refreshState();
  </script>
</body>
</html>
