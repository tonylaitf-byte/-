name: unity-puppet

services:
  hand-tracking:
    build:
      context: ./hand-tracking
    image: palm-theatre:1.1
    container_name: unity-puppet-hand-tracking
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5052:5000"
    environment:
      HAND_MODEL_COMPLEXITY: "1"
      BROWSER_FRAME_TIMEOUT: "0.8"
      THEATRE_RELEASE: "1.1"
    restart: unless-stopped
